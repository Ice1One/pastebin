apiVersion: apps/v1
kind: Deployment
metadata:
  name: pastebin-app
  labels:
    app: pastebin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pastebin
  template:
    metadata:
      labels:
        app: pastebin
    spec:
      containers:
      - name: pastebin
        image: ghcr.io/ice1one/pastebin:latest
        ports:
        - containerPort: 8000
        env:
        - name: DB_PATH
          value: "/data/pastebin.db"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
